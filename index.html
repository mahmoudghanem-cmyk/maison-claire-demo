<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maison Claire</title>
  <meta name="description" content="Simple, well made essentials for a calm home.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=3">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <div class="announcement" id="announcement"></div>

  <header class="site-header">
    <div class="container header-inner">
      <nav class="header-nav" aria-label="Main">
        <a href="#/shop" data-i18n="nav_shop">Shop</a>
        <a href="#/about" data-i18n="nav_about">About</a>
      </nav>
      <a class="logo" href="#/" data-store-name>Maison Claire</a>
      <div class="header-actions">
        <div class="lang-toggle" role="group" data-i18n-label="switch_lang">
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="fr" lang="fr">FR</button>
        </div>
        <button type="button" class="cart-button" data-open-cart data-i18n-label="open_cart">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
          <span class="cart-count" data-cart-count hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="logo logo-sm" href="#/" data-store-name>Maison Claire</a>
      <p class="muted small" data-i18n="footer_demo"></p>
      <p class="muted small">© <span data-year></span> <span data-store-name>Maison Claire</span>. <span data-i18n="footer_rights"></span></p>
    </div>
  </footer>

  <div class="drawer-overlay" data-close-cart></div>
  <aside class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cart-title" aria-hidden="true"></aside>

  <div id="demo-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Bump ?v= after editing config.js: GitHub Pages caches files for about 10 minutes -->
  <script src="assets/config.js?v=3"></script>
  <script src="assets/i18n.js?v=3"></script>
  <script src="assets/catalog.js?v=3"></script>
  <script src="assets/app.js?v=3"></script>
</body>
</html>
